[repo]
# The repository's channel takes this name too; the seats talk in agent-chat and announcements (D104).
id = "ccgram"
# The fork is public: every session's forge writes are checked for leak words and absolute paths,
# not only a seat's (#162).
forge_gate_unseated = true

[seat.downstream]
# The desk's secretary relays the person's answers, and the kit's admin asks the seat directly (its
# avatar, its account), and the sysadmin seat of the host the bot runs on answers with the bot's
# service logs; a message from any of them wakes an idle seat (D83, D110).
wake_from = "*/secretary agents-kit/admin */sysadmin"

[seat.downstream.zulip]
pool = "~/.config/agent-seat-blueprints/zulip/pool"

# The upstream's trunk and tags as watcher lines (the kit's watch-remote.sh --remote, #26; a `kit:` word
# is a path in the kit's own copy, #50). Only a `tag v* pushed` line is acted on (the priming).
[seat.downstream.watch.upstream]
cmd = "sh kit:drivers/git/watch-remote.sh --remote upstream"
